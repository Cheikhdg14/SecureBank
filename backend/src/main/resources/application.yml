server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/securebank_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Homonymes963          # ← Changez avec votre mot de passe MySQL
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # create-drop en dev, validate en prod
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: mamadounndour963@gmail.com   # ← Changez
    password:        # ← App password Gmail
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: "SecureBankJwtSecretKey2025DIC2SSI_ChangeThisInProduction_MinLength256bits"
    expiration-ms: 3600000       # 1 heure
    refresh-expiration-ms: 86400000  # 24 heures

  crypto:
    aes-key: "SecureBank16ByteK"   # 16 chars = 128-bit, ou 32 = 256-bit

  otp:
    length: 6
    expiry-minutes: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: false

logging:
  level:
    com.securebank: DEBUG
    org.springframework.security: INFO
